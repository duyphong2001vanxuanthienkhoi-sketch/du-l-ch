<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="60%" stop-color="#b2ebf2"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#00acc1"/>
    </linearGradient>
  </defs>

  <!-- Sky/background -->
  <rect width="480" height="560" fill="url(#sky)"/>

  <!-- Halong Bay silhouette hills -->
  <ellipse cx="80"  cy="420" rx="90" ry="60" fill="#a5d6a7" opacity="0.45"/>
  <ellipse cx="200" cy="410" rx="110" ry="70" fill="#81c784" opacity="0.40"/>
  <ellipse cx="360" cy="430" rx="130" ry="65" fill="#a5d6a7" opacity="0.45"/>
  <ellipse cx="460" cy="445" rx="80"  ry="50" fill="#c8e6c9" opacity="0.35"/>

  <!-- Sea waves -->
  <ellipse cx="240" cy="500" rx="320" ry="80" fill="url(#wave1)" opacity="0.55"/>
  <ellipse cx="240" cy="525" rx="290" ry="70" fill="#00bcd4"  opacity="0.45"/>
  <ellipse cx="240" cy="548" rx="260" ry="60" fill="#0097a7"  opacity="0.35"/>

  <!-- Wooden boat base -->
  <path d="M120 390 Q240 370 360 390 L375 430 Q240 450 105 430 Z" fill="#8d6e63"/>
  <path d="M125 390 Q240 375 355 390" fill="none" stroke="#795548" stroke-width="3"/>
  <!-- Boat side planks -->
  <line x1="105" y1="430" x2="120" y2="390" stroke="#795548" stroke-width="2"/>
  <line x1="375" y1="430" x2="360" y2="390" stroke="#795548" stroke-width="2"/>
  <!-- Boat rim -->
  <path d="M105 430 Q240 450 375 430" fill="none" stroke="#6d4c41" stroke-width="3"/>

  <!-- Seafood in boat -->
  <text x="155" y="413" font-size="52" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🦀</text>
  <text x="218" y="408" font-size="44" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🐟</text>
  <text x="278" y="415" font-size="48" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🦐</text>

  <!-- Floating seafood decorations -->
  <text x="38"  y="200" font-size="52" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" opacity="0.80">🦞</text>
  <text x="370" y="195" font-size="46" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" opacity="0.80">🦑</text>
  <text x="50"  y="310" font-size="38" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" opacity="0.70">🐠</text>
  <text x="395" y="330" font-size="36" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" opacity="0.70">🦪</text>
  <text x="200" y="170" font-size="34" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" opacity="0.65">🌊</text>

  <!-- Sail pole -->
  <line x1="240" y1="260" x2="240" y2="388" stroke="#795548" stroke-width="5"/>
  <!-- Sail -->
  <path d="M240 270 Q310 295 290 355 L240 355 Z" fill="#ef9a9a" opacity="0.85"/>
  <path d="M240 270 Q170 295 190 355 L240 355 Z" fill="#ffcc80" opacity="0.85"/>

  <!-- Bubbles -->
  <circle cx="45"  cy="470" r="10" fill="#b2ebf2" opacity="0.55"/>
  <circle cx="420" cy="460" r="14" fill="#b2ebf2" opacity="0.45"/>
  <circle cx="170" cy="510" r="7"  fill="#e0f7fa" opacity="0.60"/>
  <circle cx="330" cy="518" r="9"  fill="#e0f7fa" opacity="0.50"/>

  <!-- Label badge -->
  <rect x="95" y="470" width="290" height="46" rx="23" fill="#006064" opacity="0.82"/>
  <text x="240" y="499" font-size="19" font-weight="bold" text-anchor="middle" fill="white"
        font-family="Arial,sans-serif">🌊 Hải Sản Tươi Hồng Gai</text>
</svg>
